name: Cross-Compile Release Notes Tool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # macOS builds
          - goos: darwin
            goarch: amd64
            osLabel: macos-x86_64
            
          - goos: darwin
            goarch: arm64
            osLabel: macos-arm64

          # Linux builds
          - goos: linux
            goarch: amd64
            osLabel: linux-x86_64

          - goos: linux
            goarch: arm64
            osLabel: linux-arm64

          # Windows builds
          - goos: windows
            goarch: amd64
            osLabel: windows-x86_64
            suffix: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build release-notes
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o release-notes${{ matrix.suffix }} -ldflags="-s -w" .

      - name: Create release artifact
        run: |
          mkdir -p dist
          mv release-notes${{ matrix.suffix }} dist/
          cd dist
          
          if [ "${{ matrix.goos }}" == "windows" ]; then
            zip -q ../release-notes-${{ matrix.osLabel }}.zip release-notes${{ matrix.suffix }}
          else
            tar -czf ../release-notes-${{ matrix.osLabel }}.tar.gz release-notes${{ matrix.suffix }}
          fi
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-notes-${{ matrix.osLabel }}
          path: release-notes-${{ matrix.osLabel }}.*

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} release-files/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
